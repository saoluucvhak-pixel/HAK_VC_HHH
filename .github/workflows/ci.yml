name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # --ignore-scripts: không tải binary Electron / build better-sqlite3 (test chạy bằng node:sqlite)
      - run: npm ci --ignore-scripts
      - run: npm test
