name: Release

# Phát hành đúng các bộ cài ĐÃ nghiệm thu: lấy artifact của một run "Windows build" (installers=true) đã xanh, kiểm tra commit + checksum,
# rồi tạo tag + GitHub Release đính kèm đúng các tệp đó (không build lại → không đổi băm). Chạy tay, cần người có quyền ghi.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'ID run "Windows build" đã nghiệm thu (installers=true, conclusion=success)'
        required: true
      tag:
        description: 'Tag phát hành, vd v0.7.0'
        required: true
      notes_file:
        description: 'Tệp ghi chú phát hành trong repo'
        required: true
        default: 'docs/RELEASE_NOTES.md'

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Mọi đầu vào đi qua env (không chèn thẳng ${{ }} vào script) và mọi nội dung phát hành (ghi chú, package.json) được đọc ở ĐÚNG commit
      # của run đã nghiệm thu, không phải ở đầu nhánh main lúc chạy workflow (lỗi v0.8.2: ghi chú của bản sau bị đính nhầm vào bản trước).
      - name: Kiểm tra run đã nghiệm thu, tag, phiên bản và ghi chú
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ inputs.run_id }}
          TAG: ${{ inputs.tag }}
          NOTES: ${{ inputs.notes_file }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Tag phải có dạng vX.Y.Z (nhận: $TAG)"; exit 1; }
          [[ "$NOTES" != /* && "$NOTES" != *..* ]] || { echo "notes_file phải là đường dẫn tương đối trong repo"; exit 1; }
          VER="${TAG#v}"
          info=$(gh api "repos/$REPO/actions/runs/$RUN_ID")
          concl=$(jq -r .conclusion <<<"$info"); ev=$(jq -r .event <<<"$info"); sha=$(jq -r .head_sha <<<"$info"); name=$(jq -r .name <<<"$info")
          echo "run: $name / $ev / $concl / $sha"
          [ "$name" = "Windows build" ] || { echo "Không phải run Windows build"; exit 1; }
          [ "$concl" = "success" ] || { echo "Run chưa xanh ($concl) — không phát hành"; exit 1; }
          [ "$ev" = "workflow_dispatch" ] || { echo "Cần run chạy tay với installers=true"; exit 1; }
          # không trùng tag hay Release có sẵn (kể cả tag do công cụ khác tạo trước)
          if gh release view "$TAG" >/dev/null 2>&1; then echo "Release $TAG đã tồn tại"; exit 1; fi
          if gh api "repos/$REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then echo "Tag $TAG đã tồn tại"; exit 1; fi
          # đọc package.json và ghi chú ở đúng commit đã nghiệm thu
          git fetch --depth=1 origin "$sha"
          git checkout -q --detach FETCH_HEAD
          pkg=$(jq -r .version package.json)
          [ "$pkg" = "$VER" ] || { echo "package.json tại $sha là $pkg, khác tag $TAG"; exit 1; }
          [ -f "$NOTES" ] || { echo "Không có $NOTES tại $sha"; exit 1; }
          head -n 1 "$NOTES" | grep -q "VC Cost $VER" || { echo "Dòng đầu của $NOTES không nêu 'VC Cost $VER'"; exit 1; }
          cp "$NOTES" "$RUNNER_TEMP/notes-src.md"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "ver=$VER" >> "$GITHUB_OUTPUT"

      - name: Tải bộ cài đã nghiệm thu
        env: { GH_TOKEN: '${{ github.token }}', RUN_ID: '${{ inputs.run_id }}' }
        run: |
          set -euo pipefail
          mkdir -p assets && gh run download "$RUN_ID" -n vc-cost-installers -D assets
          ls -la assets

      - name: Kiểm tra SHA-256 và tên tệp khớp phiên bản
        env: { VER: '${{ steps.run.outputs.ver }}' }
        run: |
          set -euo pipefail
          cd assets
          cat SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          [ -f "VC-Cost-$VER-Setup.exe" ] && [ -f "VC-Cost-$VER-Portable.exe" ] || { echo "Thiếu VC-Cost-$VER-Setup.exe / -Portable.exe (bộ cài không đúng phiên bản $VER)"; exit 1; }
          [ "$(ls VC-Cost-*-Setup.exe | wc -l)" = 1 ] && [ "$(ls VC-Cost-*-Portable.exe | wc -l)" = 1 ] || { echo "Có nhiều hơn một bộ cài"; exit 1; }

      - name: Tạo tag và Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          SHA: ${{ steps.run.outputs.sha }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          { cat "$RUNNER_TEMP/notes-src.md"; echo; echo '## SHA-256'; echo '```'; cat assets/SHA256SUMS.txt; echo '```'; echo; echo "Commit: $SHA · build + nghiệm thu: run $RUN_ID"; } > notes.md
          gh release create "$TAG" assets/VC-Cost-*-Setup.exe assets/VC-Cost-*-Portable.exe assets/SHA256SUMS.txt \
            --target "$SHA" --title "VC Cost $TAG" --notes-file notes.md --latest
          gh release view "$TAG" --json tagName,targetCommitish,assets --jq '{tag: .tagName, target: .targetCommitish, files: [.assets[] | {name, size}]}'
