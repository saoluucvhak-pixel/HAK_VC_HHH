name: Windows build

# Kiểm tra trên Windows: test, đóng gói và khởi động THẬT bản đóng gói (cửa sổ, preload → IPC → CSDL, xuất PDF thật).
# better-sqlite3 ≥ 13 dùng N-API prebuilt (dùng chung Node/Electron) nên không cần build lại native. Chạy tay (workflow_dispatch) có thể tick "installers" để build thêm Portable + Setup.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      installers:
        description: 'Build thêm bộ cài Portable + Setup (NSIS) và đính kèm artifact'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      BUILD_INSTALLERS: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && startsWith(github.head_ref, 'codex/release-')) || (github.event_name == 'workflow_dispatch' && inputs.installers) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cài gói (tải Electron + module native)
        run: npm ci

      - name: "Test (Windows - đường dẫn, CRLF, node:sqlite)"
        run: npm test

      - name: Test bằng driver của bản đóng gói (better-sqlite3)
        run: npm test
        env:
          VCCOST_DRIVER: better-sqlite3

      - name: Đóng gói (win-unpacked)
        run: npx electron-builder --win dir --x64

      - name: Khởi động thử bản đóng gói
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'smoke.json'
          $env:VCCOST_SMOKE = '1'
          $env:VCCOST_SMOKE_OUT = $out
          $env:VCCOST_DATA_DIR = Join-Path $env:RUNNER_TEMP 'vccost-data'
          $p = Start-Process -FilePath (Resolve-Path 'dist\win-unpacked\VC Cost.exe') -WindowStyle Hidden -PassThru -Wait
          if (Test-Path $out) { Get-Content $out -Raw } else { Write-Host 'Không có file kết quả smoke' }
          if ($p.ExitCode -ne 0) { throw "Khởi động bản đóng gói thất bại (exit $($p.ExitCode))" }
          $r = Get-Content $out -Raw | ConvertFrom-Json
          if (-not $r.ok -or $r.driver -ne 'better-sqlite3') { throw 'Smoke không đạt: cần ok=true và driver=better-sqlite3' }

      - name: Đính kèm kết quả khởi động
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-result
          path: ${{ runner.temp }}/smoke.json
          if-no-files-found: ignore

      - name: Build bộ cài Portable + Setup
        if: env.BUILD_INSTALLERS == 'true'
        run: npx electron-builder --win --x64 --publish never

      - name: SHA-256 bộ cài
        if: env.BUILD_INSTALLERS == 'true'
        shell: pwsh
        run: |
          $lines = Get-ChildItem dist -Filter 'VC-Cost-*.exe' | Sort-Object Name | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" }
          $lines | Set-Content dist\SHA256SUMS.txt -Encoding ascii
          $lines
          "### SHA-256 bộ cài`n``````n$($lines -join "`n")`n``````" | Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Nghiệm thu bộ cài (cài mới, nâng cấp, thư mục dữ liệu, Portable)
        if: env.BUILD_INSTALLERS == 'true'
        shell: pwsh
        run: ./scripts/accept-windows.ps1 -DistDir dist

      - name: Đính kèm bộ cài
        if: env.BUILD_INSTALLERS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: vc-cost-installers
          path: |
            dist/VC-Cost-*-Setup.exe
            dist/VC-Cost-*-Portable.exe
            dist/SHA256SUMS.txt
          retention-days: 14

      - name: Đính kèm kết quả nghiệm thu
        if: always() && env.BUILD_INSTALLERS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-results
          path: ${{ runner.temp }}/smoke-*.json
          if-no-files-found: ignore
